name: CI

on:
  push:
  pull_request:

jobs:
  build-and-self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Test Fishstick
        run: npm test

      - name: Fishstick self-scan
        run: node dist/cli.js scan . --json --fail-on high
