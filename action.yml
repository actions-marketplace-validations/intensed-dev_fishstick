name: Fishstick Security Scanner
description: Scan repositories for security vulnerabilities, leaked secrets, and common bugs
author: intensed-dev
branding:
  icon: shield
  color: purple

inputs:
  fail-on:
    description: Optional severity that fails the workflow (disabled by default)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ github.action_path }}
    - name: Build Fishstick
      shell: bash
      run: npm run build
      working-directory: ${{ github.action_path }}
    - name: Scan
      shell: bash
      run: |
        if [ -n "${{ inputs.fail-on }}" ]; then
          node "${{ github.action_path }}/dist/cli.js" scan . --fail-on "${{ inputs.fail-on }}"
        else
          node "${{ github.action_path }}/dist/cli.js" scan .
        fi
