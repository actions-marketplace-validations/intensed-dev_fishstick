name: Fishstick
description: Scan a repository for security vulnerabilities and bugs
author: intensed-dev

inputs:
  fail-on:
    description: Minimum severity that fails the workflow
    required: false
    default: high

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      shell: bash
      run: npm install
      working-directory: ${{ github.action_path }}
    - name: Build Fishstick
      shell: bash
      run: npm run build
      working-directory: ${{ github.action_path }}
    - name: Scan
      shell: bash
      run: node "${{ github.action_path }}/dist/cli.js" scan . --fail-on "${{ inputs.fail-on }}"
